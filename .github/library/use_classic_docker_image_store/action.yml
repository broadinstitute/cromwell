name: 'Use Classic Docker Image Store'
description: >-
  Switches the runner's Docker daemon from the containerd image store back to the classic image store.
  Run this before any `sbt .../docker` task. With the containerd image store (the default for new Docker 29
  installs, e.g. ubuntu-26.04 runners) BuildKit no longer prints `writing image sha256:...`, so sbt-docker fails
  with `Could not parse Docker image id`. The only released sbt-docker that parses the newer output picks the
  config digest, which `docker tag` can't resolve under the containerd image store.

runs:
  using: "composite" # <-- this allows these steps to be used by other workflows.
  steps:
    - name: Use classic Docker image store
      shell: bash
      run: |
        set -euo pipefail
        sudo mkdir -p /etc/docker
        sudo test -s /etc/docker/daemon.json || echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
        daemon_json="$(mktemp)"
        sudo jq '.features["containerd-snapshotter"] = false' /etc/docker/daemon.json > "${daemon_json}"
        sudo install -m 644 "${daemon_json}" /etc/docker/daemon.json
        rm "${daemon_json}"
        sudo systemctl restart docker
        docker info --format 'Docker storage driver: {{.Driver}}'
