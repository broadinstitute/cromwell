project = "broad-dsde-cromwell-dev"
root = "gs://cloud-cromwell-dev-self-cleaning/cromwell_execution/ci"
maximum-polling-interval = 600
concurrent-job-limit = 1000

batch {
  auth = "service_account"
  location = "us-central1"
}

# On or about 2026-11-16 GCP Batch made a change that prevents jobs from starting on the legacy default network.
# This change was not a problem for Terra projects as they all received VPC subnetworks in the PPW migration.
# However going forward all CI jobs must now also run in VPC, as opposed to having a handful of jobs routed
# to the VPC backend to test the Terra configuration. (CTM-779)
virtual-private-cloud {
  network-name = "projects/${projectId}/global/networks/cromwell-ci-gcpbatch-vpc-network"
  subnetwork-name = "projects/${projectId}/regions/*/subnetworks/cromwell-ci-gcpbatch-vpc-network"
}

filesystems {
  gcs {
    auth = "service_account"
    project = "broad-dsde-cromwell-dev"
  }
}

slow-job-warning-time: 20 minutes

checkpointing-interval: "10 seconds"
